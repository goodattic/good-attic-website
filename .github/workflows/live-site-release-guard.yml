name: Live site release guard

on:
  push:
    branches:
      - baseline/live-site-2026-09-30
  pull_request:
    branches:
      - baseline/live-site-2026-09-30

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-live-site-baseline.mjs
